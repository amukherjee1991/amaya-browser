# Packages and publishes an Amaya release in ~15 minutes by reusing a compiled
# engine from engine.yml (GitHub Release engine-<key>). Settings, policies,
# bundled extensions and the ui/ layer are staged into it; nothing is compiled.
#
# Versioning: tags are v<firefox version>-<amaya_revision>, both read from
# upstream.json (e.g. v159.0-2). Push such a tag to release; the job refuses a
# tag that does not match. Manual runs build and upload artifacts only.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      privacy_test_duration:
        description: "Idle-traffic test duration in seconds"
        default: "300"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      DEBFULLNAME: Amaya Browser
      DEBEMAIL: noreply@users.noreply.github.com
      AMAYA_HOMEPAGE: https://amaya.arghyam.me
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        run: |
          read -r FX REV < <(python3 -c 'import json;d=json.load(open("upstream.json"));print(d["version"], d.get("amaya_revision",1))')
          echo "version=${FX}-${REV}" >> "$GITHUB_OUTPUT"
          echo "tag=v${FX}-${REV}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v${FX}-${REV}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match upstream.json (v${FX}-${REV})"; exit 1
          fi

      - name: Install system packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev desktop-file-utils appstream iproute2 \
            libgtk-3-0 libdbus-glib-1-2 libasound2 libx11-xcb1 libxtst6

      - name: Unit tests and patch lint
        run: |
          python3 -m unittest discover -s tests/tooling
          python3 -m unittest discover -s tests/privacy
          tools/amaya lint-patches

      - name: Download the compiled engine
        id: engine
        run: |
          KEY=$(tools/amaya engine-key)
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          mkdir -p engine
          if ! gh release download "engine-$KEY" --dir engine --pattern "engine-$KEY.tar.xz*"; then
            echo "::error::No compiled engine for $KEY. Run the 'Engine build' workflow first (it runs automatically when upstream.json, patches/, configs/ or branding/amaya/ change on main)."
            exit 1
          fi
          (cd engine && sha256sum -c "engine-$KEY.tar.xz.sha256")

      - name: Package
        run: |
          tools/amaya package --engine "engine/engine-${{ steps.engine.outputs.key }}.tar.xz"
          ls -la dist/

      - name: Idle-traffic privacy test (Gate 1)
        run: |
          APP=$(find dist/stage -maxdepth 3 -type f -name amaya -perm -u+x | head -1)
          set +e
          tests/privacy/run.sh "$APP" --duration "${{ github.event.inputs.privacy_test_duration || '300' }}" \
            --report dist/privacy-report.json
          rc=$?
          set -e
          if [ $rc -eq 1 ]; then echo "::error::Idle-traffic test found destinations outside the allow-list"; exit 1; fi
          if [ $rc -eq 2 ]; then echo "::warning::Idle-traffic harness could not run on this runner (exit 2)"; fi

      - name: Checksums
        run: |
          cd dist
          sha256sum amaya_*.deb amaya-*.tar.xz > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amaya-${{ steps.ver.outputs.version }}-linux-x86_64
          path: |
            dist/amaya_*.deb
            dist/amaya-*.tar.xz
            dist/SHA256SUMS
            dist/privacy-report.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          {
            echo "Amaya ${{ steps.ver.outputs.version }} for Linux (x86_64), on Gecko $(python3 -c 'import json;print(json.load(open("upstream.json"))["version"])')."
            echo
            echo "Install on Debian/Ubuntu: \`sudo apt install ./$(cd dist && ls amaya_*.deb)\`"
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`. Idle-traffic test report: \`privacy-report.json\`."
            echo "Engine: [engine-${{ steps.engine.outputs.key }}](${{ github.server_url }}/${{ github.repository }}/releases/tag/engine-${{ steps.engine.outputs.key }})"
          } > notes.md
          gh release create "$TAG" dist/amaya_*.deb dist/amaya-*.tar.xz dist/SHA256SUMS dist/privacy-report.json \
            --title "Amaya ${{ steps.ver.outputs.version }}" --notes-file notes.md --prerelease --verify-tag
