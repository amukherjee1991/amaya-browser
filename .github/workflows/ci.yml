# Fast checks on every push and pull request. No browser build here; that is release.yml.
name: CI

on:
  push:
    branches: [main, test/local, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dpkg-dev desktop-file-utils appstream shellcheck

      - name: Tooling unit tests
        run: python3 -m unittest discover -s tests/tooling -v

      - name: Privacy harness unit tests
        run: python3 -m unittest discover -s tests/privacy -v

      - name: Patch headers
        run: tools/amaya lint-patches

      - name: Settings JSON parses
        run: for f in settings/*.json tests/privacy/allowlist.json; do python3 -m json.tool "$f" >/dev/null && echo "ok $f"; done

      - name: Shellcheck packaging scripts
        run: shellcheck packaging/debian/*.sh packaging/debian/apt-repo/*.sh

      - name: .deb smoke test (fake payload)
        run: packaging/debian/test-build-deb.sh
