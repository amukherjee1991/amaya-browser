/* ======================================================================
 * 9. Fingerprinting modes
 * ==================================================================== */
var amayaFpMode = getPref("amaya.fingerprinting.mode");
if (amayaFpMode === "uniform") {
  // Tor/Mullvad-style: every Amaya-uniform user looks the same.
  defaultPref("privacy.resistFingerprinting", true);
  defaultPref("privacy.resistFingerprinting.pbmode", true);
  defaultPref("privacy.resistFingerprinting.letterboxing", true);
  defaultPref("privacy.resistFingerprinting.block_mozAddonManager", true);
  defaultPref("privacy.spoof_english", 2);
  defaultPref("intl.regional_prefs.use_os_locales", false);
  defaultPref("privacy.fingerprintingProtection", false);
  defaultPref("privacy.fingerprintingProtection.pbmode", false);
  defaultPref("webgl.enable-debug-renderer-info", false);
  defaultPref("media.peerconnection.ice.no_host", true);
  defaultPref("widget.non-native-theme.use-theme-accent", false);
} else {
  // "balanced" (default, and fallback for unknown values): Firefox's
  // fingerprinting protection (FPP) with a stronger target set. Randomises
  // canvas/WebGL readback per site+session and reduces system details, but
  // keeps real locale, timezone, window size and screen size so sites work.
  defaultPref("privacy.resistFingerprinting", false);
  defaultPref("privacy.resistFingerprinting.pbmode", false);
  defaultPref("privacy.fingerprintingProtection", true);
  defaultPref("privacy.fingerprintingProtection.pbmode", true);
  defaultPref("privacy.fingerprintingProtection.overrides",
    "+CanvasRandomization,+EfficientCanvasRandomization,+WebGLRandomization," +
    "+WebGLRendererConstant,+WebGLVendorSanitize,+FontVisibilityLangPack," +
    "+NavigatorHWConcurrencyTiered,+MaxTouchPointsCollapse," +
    "+ScreenAvailToResolution,+JSMathFdlibm,+IMEStyle,+AudioSampleRate," +
    "+NavigatorOscpu,+NetworkConnection,+CSSColorInfo," +
    // Screen size = window size, as resistFingerprinting reports it
    // (issue #7). Layout uses the window size, so pages are unaffected.
    "+ScreenRect,+ScreenAvailRect");
}

/* ======================================================================
 * 10. Updates, add-ons, uBlock Origin bundle
 * ==================================================================== */
// Linux: app updates come from the apt repository; the updater is compiled
// out there (configs/mozconfig.privacy).  macOS keeps the updater (Phase M).
// System add-ons are built in; no out-of-band updates.
defaultPref("extensions.systemAddon.update.enabled", false);
defaultPref("extensions.systemAddon.update.url", "");
// User extensions (incl. bundled uBlock Origin) keep daily update checks
// against addons.mozilla.org: they carry security fixes.
defaultPref("extensions.update.enabled", true);
defaultPref("extensions.update.autoUpdateDefault", true);
// ...but not in the first minute of a brand-new profile: the bundled copy
// ships with the release, so the first check waits one day (issue #6).
// One-time marker, so later timer state is the timer manager's own.
if (getPref("amaya.migration.firstRunTimers") !== true) {
  var amayaNow = Math.floor(Date.now() / 1000);
  if (!getPref("app.update.lastUpdateTime.addon-background-update-timer")) {
    pref("app.update.lastUpdateTime.addon-background-update-timer", amayaNow);
  }
  // Same for the OpenH264 (WebRTC video codec) download from Cisco and the
  // plugin check on aus5.mozilla.org: one day after first start, not in the
  // first minute. VP8/VP9 calls work meanwhile; DRM turned on by the person
  // still installs Widevine at once (that path resets this timestamp).
  if (!getPref("media.gmp-manager.lastCheck")) {
    pref("media.gmp-manager.lastCheck", amayaNow);
  }
  pref("amaya.migration.firstRunTimers", true);
}
// Bundled extensions: <appdir>/distribution/extensions/<id>.xpi is copied
// into the profile on first run (and after app updates) without any network
// fetch.  Distribution installs are not "foreign", so they are enabled even
// though sideloads stay disabled (autoDisableScopes 15 = every scope).
defaultPref("extensions.installDistroAddons", true);
defaultPref("extensions.autoDisableScopes", 15);
// Only load add-ons from the profile (1) and the application dir (4);
// ignore ~/.mozilla/extensions and /usr/{lib,share}/mozilla/extensions.
defaultPref("extensions.enabledScopes", 5);
defaultPref("extensions.startupScanScopes", 0);
// Signed add-ons only.  Security-critical: locked.
lockPref("xpinstall.signatures.required", true);
// Blocklist stays on (Remote Settings, Mozilla).  Security-critical: locked.
lockPref("extensions.blocklist.enabled", true);
// OpenH264 (WebRTC) stays available; DRM (Widevine) is opt-in: Firefox
// shows a bar asking to enable DRM when a site needs it.
defaultPref("media.eme.enabled", false);
// media.eme.enabled alone does not stop the plugin manager downloading
// Widevine from update.googleapis.com, so the plugin follows the DRM switch:
// it is fetched only after the person turns DRM on (takes effect on restart).
defaultPref("media.gmp-widevinecdm.enabled", getPref("media.eme.enabled"));
// The plugin manager asks Google's Chromium update service about Widevine for
// every update check, before it looks at whether the plugin is enabled. Use
// Mozilla's update service only (it still serves Widevine once DRM is on).
defaultPref("media.gmp-widevinecdm.allow-chromium-update", false);

/* ======================================================================
 * 11. Security: kept ON (documented, never weakened)
 * ==================================================================== */
// Safe Browsing list updates stay on (phishing / malware). Remote lookups of
// downloaded files send file metadata to Google: off.
defaultPref("browser.safebrowsing.malware.enabled", true);
defaultPref("browser.safebrowsing.phishing.enabled", true);
defaultPref("browser.safebrowsing.downloads.enabled", true);
defaultPref("browser.safebrowsing.downloads.remote.enabled", false);
defaultPref("browser.safebrowsing.downloads.remote.url", "");
// Certificate revocation: CRLite (Remote Settings) + OCSP fallback.
defaultPref("security.remote_settings.crlite_filters.enabled", true);
defaultPref("security.remote_settings.intermediates.enabled", true);
defaultPref("security.OCSP.enabled", 1);
// Refuse servers that do not support secure TLS renegotiation (RFC 5746).
// Not locked: a handful of ancient servers break and users may need it off.
defaultPref("security.ssl.require_safe_negotiation", true);
// Remote Settings: the security collections (blocklists, CRLite,
// intermediates, ETP lists) need it.  Poll at most once a day.
defaultPref("services.settings.poll_interval", 86400);
// The Amaya sidebar builds on Gecko's revamped sidebar with vertical tabs;
// default them on so the first start does not begin with horizontal tabs.
defaultPref("sidebar.revamp", true);
defaultPref("sidebar.verticalTabs", true);

/* ======================================================================
 * 12. Amaya workflow UI loader  (owner: ui foundation; see ui/README.md)
 *     Needs the unsandboxed autoconfig context (autoconfig.js sets
 *     general.config.sandbox_enabled=false). Loads <appdir>/amaya-ui/
 *     loader.js, or $AMAYA_UI_DIR/loader.js in development. Everything is in
 *     try/catch: an uncaught exception in an unsandboxed .cfg makes Firefox
 *     show an autoconfig error and quit.
 * ==================================================================== */
try {
  (function () {
    if (typeof Services === "undefined" || !Services.scriptloader) {
      return; // sandboxed autoconfig: no UI layer
    }
    var dir;
    var envDir = Services.env.get("AMAYA_UI_DIR");
    if (envDir) {
      dir = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      dir.initWithPath(envDir);
    } else {
      try {
        dir = Services.dirsvc.get("GreD", Ci.nsIFile);
      } catch (e) {
        dir = Services.dirsvc.get("XCurProcD", Ci.nsIFile);
      }
      dir.append("amaya-ui");
    }
    var loader = dir.clone();
    loader.append("loader.js");
    if (!loader.exists()) {
      return;
    }
    var dirURL = Services.io.newFileURI(dir).spec;
    if (!dirURL.endsWith("/")) {
      dirURL += "/";
    }
    Services.scriptloader.loadSubScriptWithOptions(dirURL + "loader.js", {
      target: { AMAYA_UI_DIR_URL: dirURL },
      ignoreCache: true,
      allowUnsafeURL: true, // file: URL in our own install dir
    });
  })();
} catch (e) {
  try {
    Cu.reportError("[amaya-ui] loader failed: " + e);
  } catch (e2) {}
}
