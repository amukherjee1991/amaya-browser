// Amaya Browser autoconfig (first line must be a comment: Firefox skips it).
/*
 * settings/amaya.cfg  ->  <appdir>/amaya.cfg
 *
 * Loaded by <appdir>/defaults/pref/autoconfig.js (general.config.filename).
 * Evaluated in the (unsandboxed) autoconfig context after the profile's prefs.js
 * has been read, so getPref() sees the user's own values.
 *
 * Conventions (see docs/privacy-defaults.md for the rationale of every line):
 *   defaultPref(name, v)  default value; the user can still change it in
 *                         Settings / about:config and the change persists.
 *   lockPref(name, v)     only for kill-switches of things that are compiled
 *                         out or removed anyway, and for security-critical
 *                         prefs.  Each lock carries a comment explaining why.
 *   pref(name, v)         writes a *user* value.  Only used behind a one-time
 *                         marker (amaya.migration.*) so later user choices win.
 *
 * Owner: privacy.  Every pref name here is checked against the Firefox 159
 * source tree (see docs/privacy-defaults.md, "Validation").
 */

/* ======================================================================
 * 0. Amaya's own prefs
 * ==================================================================== */
