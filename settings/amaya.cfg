/* ======================================================================
 * 7. Tracking protection, cookies, referrers, GPC, HTTPS-Only
 * ==================================================================== */
// ETP Strict.  ContentBlockingPrefs only honours the category when it is a
// *user* value, so apply it once on first run; afterwards the user's choice
// (Standard / Custom) is preserved.
if (getPref("amaya.migration.etpStrict") !== true) {
  pref("browser.contentblocking.category", "strict");
  pref("amaya.migration.etpStrict", true);
}
// Total Cookie Protection (also part of strict; kept explicit as default).
defaultPref("network.cookie.cookieBehavior", 5);
defaultPref("network.cookie.cookieBehavior.pbmode", 5);
// Query-parameter stripping (strict includes qps; also on share/copy).
defaultPref("privacy.query_stripping.enabled", true);
defaultPref("privacy.query_stripping.enabled.pbmode", true);
defaultPref("privacy.query_stripping.strip_on_share.enabled", true);
// Bounce tracking protection: 1 = enabled (purge).
defaultPref("privacy.bounceTrackingProtection.mode", 1);
// Referrer: send only scheme+host+port cross-origin.
defaultPref("network.http.referer.XOriginTrimmingPolicy", 2);
// Global Privacy Control on (DNT is deprecated and not sent).
defaultPref("privacy.globalprivacycontrol.enabled", true);
defaultPref("privacy.donottrackheader.enabled", false);
// HTTPS-Only mode in all windows. Users can add per-site exceptions.
defaultPref("dom.security.https_only_mode", true);
defaultPref("dom.security.https_only_mode_send_http_background_request", false);
// Hyperlink auditing (<a ping>) and sendBeacon.
defaultPref("browser.send_pings", false);
// WebRTC: do not expose local IPs to sites without camera/mic permission.
defaultPref("media.peerconnection.ice.default_address_only", true);

